}

def osSharedLibExtension() {
  def osName = System.getProperty('os.name').toLowerCase()
  if (osName.contains('mac') || osName.contains('darwin')) return 'dylib'
  if (osName.contains('linux')) return 'so'
  if (osName.contains('windows')) return 'dll'
  return 'so'
}

def jniPlatformDir() {
  def osName = System.getProperty('os.name').toLowerCase()
  if (osName.contains('mac') || osName.contains('darwin')) return 'darwin'
  if (osName.contains('linux')) return 'linux'
  if (osName.contains('windows')) return 'win32'
  return 'linux'
}

// Zipline bundles JNI headers under include/unix and include/windows
def ziplineJniPlatformDir() {
  def osName = System.getProperty('os.name').toLowerCase()
  if (osName.contains('windows')) return 'windows'
  return 'unix'
}

def jdkIncludeDir = "${System.getProperty('java.home')}/../include"
def bridgeHeadersPath = "${rootProject.projectDir}/../zipline/zipline/native"

// Merges bridge_init_all functions from both modules into a single C file.
// Used by the Android CMake build (runs before CMake configure) and the desktop build.
tasks.register('mergeBridgeSources') {
  description = 'Merges bridge_module_init.c from all annotated modules'
  dependsOn('compileKotlinJvm', ':redwood-protocol:compileKotlinJvm', ':redwood-runtime:compileKotlinJvm')

  def hostBridgeDir = file("${buildDir}/generated/bridge/c")
  def protoBridgeDir = file("${rootProject.projectDir}/redwood-protocol/build/generated/bridge/c")
  def runtimeBridgeDir = file("${rootProject.projectDir}/redwood-runtime/build/generated/bridge/c")
  // Compose-live protocol-host modules (in the including build) also generate bridge C code.
  // Only ru.wildberries.* modules are used; io.composelive.standard.* is a separate variant.
  def composeLiveRoot = file("${rootProject.projectDir}/../compose-live")
  def wbProtoBridgeDir = file("${composeLiveRoot}/wb/nodes/main/generated/protocol-host/build/generated/bridge/c")
  def commonBridgeDir = file("${composeLiveRoot}/core/nodes/foundation/common/build/generated/bridge/c")
  def mergedDir = file("${buildDir}/generated/bridge/merged")
  def mergedInitFile = file("${mergedDir}/bridge_module_init.c")
  def cmakeSnippetFile = file("${mergedDir}/compose_live_sources.cmake")

  // Capture bridge_module_init.c from each module at configuration time (for config-cache compat).
  def hostBridgeInitFiles = fileTree(hostBridgeDir) { include('bridge_module_init.c') }.files
  def protoBridgeInitFiles = fileTree(protoBridgeDir) { include('bridge_module_init.c') }.files
  def runtimeBridgeInitFiles = fileTree(runtimeBridgeDir) { include('bridge_module_init.c') }.files
  inputs.files(
    fileTree(hostBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    fileTree(protoBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    fileTree(runtimeBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    // Compose-live bridge C sources — track them so the merge task re-runs
    // when they change. Directories may not exist yet at configuration time;
    // fileTree gracefully handles missing dirs.
    fileTree(wbProtoBridgeDir) { include('*.c') },
    fileTree(commonBridgeDir) { include('*.c') }
  )
  outputs.file(mergedInitFile)

  doLast {
    // Collect table entries and forward declarations from each module.
    // Per-class C files have static toJavaObject functions (no extern, no table entries).
    // The bridge_module_init.c generated by the compiler plugin has both extern declarations
    // and table entries. We scan per-class files AND bridge_module_init.c to get complete info.
    // Compose-live modules' C files may not have existed at configuration time; discover
    // them now (at execution time, after those modules have been compiled).
    def composeLiveSources = []
    [wbProtoBridgeDir, commonBridgeDir].each { dir ->
      if (dir.exists()) dir.eachFileMatch(~/.*\.c/) { composeLiveSources << it }
    }
    def allSources = inputs.files.files + hostBridgeInitFiles + protoBridgeInitFiles +
        runtimeBridgeInitFiles + composeLiveSources
    def tableEntries = allSources
      .collectMany { src ->
        src.readLines().findAll { it.trim().startsWith('{"') && it.contains('_toJavaObject') }
      }.unique().sort()
    def forwards = allSources
      .collectMany { src ->
        src.readLines().findAll { it.startsWith('extern jobject ') }
      }.unique().sort()
    // Collect _init forward declarations for cached JNI ref initialization.
    def initForwards = allSources
      .collectMany { src ->
        src.readLines().findAll { it.startsWith('extern void ') && it.contains('_init(JNIEnv *env)') }
      }.unique().sort()
    // Extract the function name from each init forward to call from init_all.
    def initCalls = initForwards.collect { line ->
      line.replace('extern void ', '').replace('(JNIEnv *env);', '').trim()
    }
    mergedDir.mkdirs()
    mergedInitFile.text = """#include \"bridge_dispatch.h\"
#include <string.h>
#ifdef __ANDROID__
#include <android/log.h>
#endif

${forwards.join('\n')}
${initForwards.join('\n')}

static struct { const char *fq; jobject (*fn)(JNIEnv*,JSContext*,const JSValue*); } bridge_table[] = {
${tableEntries.join('\n')}
    {NULL, NULL}
};

static JSValue bridge_register_js(JSContext *ctx, JSValueConst this_val,
    int argc, JSValueConst *argv) {
    if (argc < 2) return JS_UNDEFINED;
    const char *fq = JS_ToCString(ctx, argv[0]);
    if (!fq) return JS_UNDEFINED;
    JSValue ctor = argv[1];
    if (JS_IsUndefined(ctor)) { JS_FreeCString(ctx, fq); return JS_UNDEFINED; }
    for (int i = 0; bridge_table[i].fq != NULL; i++) {
        if (strcmp(bridge_table[i].fq, fq) == 0) {
            JniBridgeDispatch *disp = (JniBridgeDispatch *)js_malloc(ctx, sizeof(JniBridgeDispatch));
            disp->toJavaObject = bridge_table[i].fn;
            JSValue proto = JS_GetPropertyStr(ctx, ctor, \"prototype\");
            JS_SetPropertyStr(ctx, proto, \"bridge_dispatch\",
                JS_NewFloat64(ctx, (double)(intptr_t)disp));
            JS_FreeValue(ctx, proto);
#ifdef __ANDROID__
            __android_log_print(ANDROID_LOG_INFO, \"BRIDGE\", \"bridge installed for %s\", fq);
#endif
            JS_FreeCString(ctx, fq);
            return JS_UNDEFINED;
        }
    }
    JS_FreeCString(ctx, fq);
    return JS_UNDEFINED;
}

void register_all(JSContext *ctx) {
    JSValue global = JS_GetGlobalObject(ctx);
    JS_SetPropertyStr(ctx, global, \"__bridgeRegister\",
        JS_NewCFunction(ctx, bridge_register_js, \"__bridgeRegister\", 2));
    JS_FreeValue(ctx, global);
}

// Caches all JNI class/method/field references from the main thread.
// Must be called once before any _toJavaObject conversion (from bridgeInitAllNative).
void init_all(JNIEnv *env) {
${initCalls.collect { "    ${it}(env);" }.join('\n')}
}
"""

    // Generate a CMake snippet listing compose-live C files discovered at
    // execution time. CMakeLists.txt includes this instead of file(GLOB) so
    // it always sees the files that exist when the merge task ran.
    def wbSources = []
    def commonSources = []
    if (wbProtoBridgeDir.exists()) {
      wbProtoBridgeDir.eachFileMatch(~/.*\.c/) {
        if (!it.name.equals('bridge_module_init.c')) wbSources << it.absolutePath
      }
    }
    if (commonBridgeDir.exists()) {
      commonBridgeDir.eachFileMatch(~/.*\.c/) {
        if (!it.name.equals('bridge_module_init.c')) commonSources << it.absolutePath
      }
    }
    cmakeSnippetFile.text = ""
    if (wbSources) {
      cmakeSnippetFile.text += "set(CL_WB_SOURCES\n"
      wbSources.each { cmakeSnippetFile.text += "    \"${it}\"\n" }
      cmakeSnippetFile.text += ")\n"
    }
    if (commonSources) {
      cmakeSnippetFile.text += "set(CL_COMMON_SOURCES\n"
      commonSources.each { cmakeSnippetFile.text += "    \"${it}\"\n" }
      cmakeSnippetFile.text += ")\n"
    }
  }
}

tasks.register('compileBridgeLibrary') {
  description = 'Compiles generated bridge C files into a shared library (desktop)'
  dependsOn('mergeBridgeSources')

  def outDir = file("${buildDir}/native")
  def libExt = osSharedLibExtension()
  def outFile = file("${outDir}/libredwood-bridge.${libExt}")
  def hostBridgeDir = file("${buildDir}/generated/bridge/c")
  def protoBridgeDir = file("${rootProject.projectDir}/redwood-protocol/build/generated/bridge/c")
  def runtimeBridgeDir = file("${rootProject.projectDir}/redwood-runtime/build/generated/bridge/c")
  // Only ru.wildberries.* modules are used; io.composelive.standard.* is a separate variant.
  def composeLiveRoot = file("${rootProject.projectDir}/../compose-live")
  def wbProtoBridgeDir = file("${composeLiveRoot}/wb/nodes/main/generated/protocol-host/build/generated/bridge/c")
  def commonBridgeDir = file("${composeLiveRoot}/core/nodes/foundation/common/build/generated/bridge/c")
  def mergedInitFile = file("${buildDir}/generated/bridge/merged/bridge_module_init.c")
  def jniWrapper = file('src/bridge/c/bridge_jni.c')

  def generatedC = files(
    fileTree(hostBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    fileTree(protoBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    fileTree(runtimeBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    fileTree(wbProtoBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    fileTree(commonBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    mergedInitFile
  )

  def jniPlatform = jniPlatformDir()
  def ziplineJniPlatform = ziplineJniPlatformDir()
  def includePaths = [
    '-I', jdkIncludeDir,
    '-I', "${jdkIncludeDir}/${jniPlatform}",
    '-I', bridgeHeadersPath,
    '-I', "${bridgeHeadersPath}/include/share",
    '-I', "${bridgeHeadersPath}/include/${ziplineJniPlatform}",
    '-I', "${bridgeHeadersPath}/quickjs",
  ]
  def linkerFlags = libExt == 'dylib'
    ? ['-undefined', 'dynamic_lookup']
    : ['-Wl,--allow-shlib-undefined']

  inputs.files(generatedC)
  inputs.file(jniWrapper)
  outputs.file(outFile)

  doLast {
    outDir.mkdirs()
    def cmd = ['cc', '-shared', '-fPIC'] + linkerFlags + includePaths + ['-o', outFile.absolutePath]
    (generatedC.files + jniWrapper).each { src -> cmd.add(src.absolutePath) }
    def proc = cmd.execute([], outDir)
    def exitCode = proc.waitFor()
    if (exitCode != 0) {
      throw new GradleException("cc failed with exit code $exitCode:\n${proc.err.text}")
    }
  }
}

kotlin.sourceSets.jsMain {
  kotlin.srcDir("${buildDir}/generated/bridge/c")
}
tasks.named('compileKotlinJs').configure { dependsOn('compileKotlinJvm') }

// Merge bridge_fqns.txt from all modules into a Kotlin constant.
// The output goes to Zipline's hostMain generated sources.
tasks.register('mergeBridgeFqns') {
  dependsOn('mergeBridgeSources')
  def hostBridgeDir = file("${buildDir}/generated/bridge/c")
  def protoBridgeDir = file("${rootProject.projectDir}/redwood-protocol/build/generated/bridge/c")
  def fqnFiles = files(
    fileTree(hostBridgeDir) { include('bridge_fqns.txt') },
    fileTree(protoBridgeDir) { include('bridge_fqns.txt') }
  )
  def fqnOutputDir = file("${buildDir}/generated/bridge/fqns")
  def fqnOutputFile = file("${fqnOutputDir}/BridgeFqns.kt")

  inputs.files(fqnFiles)
  outputs.file(fqnOutputFile)

  doLast {
    def allFqns = fqnFiles.files.collectMany { it.readLines() }.findAll { !it.isEmpty() }.unique().sort()
    fqnOutputDir.mkdirs()
    fqnOutputFile.text = """// Generated by bridge plugin — do not edit
package app.cash.zipline.internal

internal val BRIDGE_FQNS: List<String> = listOf(
${allFqns.collect { "    \"$it\"" }.join(",\n")}
)
"""
  }
}

tasks.named('jvmProcessResources').configure {
  dependsOn('compileBridgeLibrary')
  from("${buildDir}/native") {
    include('*.so', '*.dylib', '*.dll')
  }
}
