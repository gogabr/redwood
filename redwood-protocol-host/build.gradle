import static app.cash.redwood.buildsupport.TargetGroup.Common

redwoodBuild {
  targets(Common)
  publishing()
}

apply plugin: 'com.github.gmazzo.buildconfig'
apply plugin: 'dev.drewhamilton.poko'

kotlin {
  sourceSets {
    commonMain {
      kotlin.srcDir(redwoodBuild.generateComposeHelpers(tasks, 'app.cash.redwood.protocol.host'))
      dependencies {
        api projects.redwoodProtocol
        api projects.redwoodWidget
        api projects.redwoodLeakDetector
        implementation libs.androidx.collection
        compileOnly 'io.github.tret9:zipline-bridge-annotations:1.28.0-composelive-0.4-SNAPSHOT'
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlin.test
        implementation libs.assertk
        implementation projects.testApp.schema.compose
        implementation projects.testApp.schema.testing
        implementation projects.testApp.schema.protocolHost
      }
    }
  }
}

dependencies {
  kotlinCompilerPluginClasspath 'io.github.tret9:zipline-bridge-kotlin-plugin:1.28.0-composelive-0.4-SNAPSHOT'
}

buildConfig {
  useKotlinOutput {
    topLevelConstants = true
  }

  className("Version")
  packageName('app.cash.redwood.protocol.host')
  buildConfigField(
    "app.cash.redwood.protocol.RedwoodVersion",
    "hostRedwoodVersion",
    "RedwoodVersion(\"${project.version}\")",
  )
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
  compilerOptions.freeCompilerArgs.addAll(
    '-P', "plugin:app.cash.zipline.bridge.kotlin:cOutputDir=${buildDir}/generated/bridge/c"
  )
}

def osSharedLibExtension() {
  def osName = System.getProperty('os.name').toLowerCase()
  if (osName.contains('mac') || osName.contains('darwin')) return 'dylib'
  if (osName.contains('linux')) return 'so'
  if (osName.contains('windows')) return 'dll'
  return 'so'
}

def jniPlatformDir() {
  def osName = System.getProperty('os.name').toLowerCase()
  if (osName.contains('mac') || osName.contains('darwin')) return 'darwin'
  if (osName.contains('linux')) return 'linux'
  if (osName.contains('windows')) return 'win32'
  return 'linux'
}

// Zipline bundles JNI headers under include/unix and include/windows
def ziplineJniPlatformDir() {
  def osName = System.getProperty('os.name').toLowerCase()
  if (osName.contains('windows')) return 'windows'
  return 'unix'
}

def jdkIncludeDir = "${System.getProperty('java.home')}/../include"
def bridgeHeadersPath = "${rootProject.projectDir}/../zipline/zipline/native"

tasks.register('compileBridgeLibrary') {
  description = 'Compiles generated bridge C files into a shared library'
  dependsOn('compileKotlinJvm')

  def outDir = file("${buildDir}/native")
  def libExt = osSharedLibExtension()
  def outFile = file("${outDir}/libredwood-bridge.${libExt}")
  def hostBridgeDir = file("${buildDir}/generated/bridge/c")
  def protoBridgeDir = file("${rootProject.projectDir}/redwood-protocol/build/generated/bridge/c")
  def mergedDir = file("${buildDir}/generated/bridge/merged")
  def mergedInitFile = file("${mergedDir}/bridge_module_init.c")

  def generatedC = files(
    fileTree(hostBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    fileTree(protoBridgeDir) { include('*.c') exclude('bridge_module_init.c') }
  )

  // Pre-compute the init function names at configuration time
  def allSources = files(
    fileTree(hostBridgeDir) { include('*.c') exclude('bridge_module_init.c') },
    fileTree(protoBridgeDir) { include('*.c') exclude('bridge_module_init.c') }
  )
  def initFunctions = allSources.files
    .collectMany { src ->
      src.readLines()
        .findAll { it =~ /^void [a-z_]+_bridge_init/ }
        .collect { it.split('\\(|=)')[0].split(' ').last() }
    }.unique().sort()
  def jniWrapper = file('src/bridge/c/bridge_jni.c')
  // Capture all values at configuration time to avoid closure delegation issues in doLast
  def jniPlatform = jniPlatformDir()
  def ziplineJniPlatform = ziplineJniPlatformDir()
  def includePaths = [
    '-I', jdkIncludeDir,
    '-I', "${jdkIncludeDir}/${jniPlatform}",
    '-I', bridgeHeadersPath,
    '-I', "${bridgeHeadersPath}/include/share",
    '-I', "${bridgeHeadersPath}/include/${ziplineJniPlatform}",
    '-I', "${bridgeHeadersPath}/quickjs",
  ]
  def linkerFlags = libExt == 'dylib'
    ? ['-undefined', 'dynamic_lookup']
    : ['-Wl,--allow-shlib-undefined']

  inputs.files(generatedC)
  inputs.file(jniWrapper)
  outputs.file(outFile)

  doLast {
    outDir.mkdirs()
    mergedDir.mkdirs()
    mergedInitFile.text = """#include \"bridge_dispatch.h\"
${initFunctions.collect { "void ${it}(JSContext *ctx);" }.join('\n')}

void bridge_init_all(JSContext *ctx) {
${initFunctions.collect { "    ${it}(ctx);" }.join('\n')}
}
"""

    def cmd = ['cc', '-shared', '-fPIC'] + linkerFlags + includePaths + ['-o', outFile.absolutePath]
    (generatedC.files + jniWrapper + mergedInitFile).each { src -> cmd.add(src.absolutePath) }
    def proc = cmd.execute([], outDir)
    def exitCode = proc.waitFor()
    if (exitCode != 0) {
      throw new GradleException("cc failed with exit code $exitCode:\n${proc.err.text}")
    }
  }
}

tasks.named('jvmProcessResources').configure {
  dependsOn('compileBridgeLibrary')
  from("${buildDir}/native") {
    include('*.so', '*.dylib', '*.dll')
  }
}
