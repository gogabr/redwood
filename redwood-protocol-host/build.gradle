}
// Runs after ALL JVM compilations (including compose-live's) to produce the
// final merged bridge_module_init.c with complete table entries.
// This is separate from mergeBridgeSources because compose-live's JVM
// compilation depends on redwood JVM jars — a single task would be circular.
tasks.register('mergeAllBridgeSources') {
  description = 'Re-generates bridge_module_init.c after compose-live JVM compilations'
  dependsOn(':redwood-protocol-host:mergeBridgeSources')

  // Access compose-live tasks via the parent Gradle build.
  def rootBuild = gradle.parent
  if (rootBuild != null) {
    def wbCompile = rootBuild.rootProject.tasks.findByPath(':wb:nodes:main:generated:protocol-host:compileKotlinJvm')
    def commonCompile = rootBuild.rootProject.tasks.findByPath(':core:nodes:foundation:common:compileKotlinJvm')
    if (wbCompile != null) dependsOn(wbCompile)
    if (commonCompile != null) dependsOn(commonCompile)
  }

  def composeLiveRoot = file("${rootProject.projectDir}/../compose-live")
  def hostBridgeDir    = file("${buildDir}/generated/bridge/c")
  def protoBridgeDir   = file("${rootProject.projectDir}/redwood-protocol/build/generated/bridge/c")
  def runtimeBridgeDir = file("${rootProject.projectDir}/redwood-runtime/build/generated/bridge/c")
  def wbProtoBridgeDir = file("${composeLiveRoot}/wb/nodes/main/generated/protocol-host/build/generated/bridge/c")
  def commonBridgeDir  = file("${composeLiveRoot}/core/nodes/foundation/common/build/generated/bridge/c")
  def sourceDirs       = [hostBridgeDir, protoBridgeDir, runtimeBridgeDir, wbProtoBridgeDir, commonBridgeDir]
  def mergedDir        = file("${buildDir}/generated/bridge/merged")
  def mergedInitFile   = file("${mergedDir}/bridge_module_init.c")
  def cmakeSnippetFile = file("${mergedDir}/compose_live_sources.cmake")

  inputs.files(sourceDirs.collect { dir -> fileTree(dir) { include('*.c') } })
  // Overwrites mergeBridgeSources output; must always run.
  outputs.upToDateWhen { false }

  doLast {
    def composeLiveSources = []
    [wbProtoBridgeDir, commonBridgeDir].each { dir ->
      if (dir.exists()) dir.eachFileMatch(~/.*\.c/) { composeLiveSources << it }
    }
    def allSources = inputs.files.files + composeLiveSources
    def tableEntries = allSources
      .collectMany { src -> src.readLines().findAll { it.trim().startsWith('{"') && it.contains('_toJavaObject') } }
      .unique().sort()
    def forwards = allSources
      .collectMany { src -> src.readLines().findAll { it.startsWith('extern jobject ') } }
      .unique().sort()
    def initForwards = allSources
      .collectMany { src -> src.readLines().findAll { it.startsWith('extern void ') && it.contains('_init(JNIEnv *env)') } }
      .unique().sort()
    def initCalls = initForwards.collect { line ->
      line.replace('extern void ', '').replace('(JNIEnv *env);', '').trim()
    }
    mergedDir.mkdirs()
    mergedInitFile.text = """#include "bridge_dispatch.h"
#include <string.h>
#ifdef __ANDROID__
#include <android/log.h>
#endif

${forwards.join('\n')}
${initForwards.join('\n')}

static struct { const char *fq; jobject (*fn)(JNIEnv*,JSContext*,const JSValue*); } bridge_table[] = {
${tableEntries.join('\n')}
    {NULL, NULL}
};

static JSValue bridge_register_js(JSContext *ctx, JSValueConst this_val,
    int argc, JSValueConst *argv) {
