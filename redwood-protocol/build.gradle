import static app.cash.redwood.buildsupport.TargetGroup.Common

redwoodBuild {
  targets(Common)
  publishing()
}

apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'dev.drewhamilton.poko'

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api libs.kotlinx.serialization.core
        api libs.kotlinx.serialization.json
        compileOnly 'io.github.tret9:zipline-bridge-annotations:1.28.0-composelive-0.4-SNAPSHOT'
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlin.test
        implementation libs.assertk
      }
    }
  }
}

dependencies {
  kotlinCompilerPluginClasspath 'io.github.tret9:zipline-bridge-kotlin-plugin:1.28.0-composelive-0.4-SNAPSHOT'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
  compilerOptions.freeCompilerArgs.addAll(
    '-P', "plugin:app.cash.zipline.bridge.kotlin:cOutputDir=${buildDir}/generated/bridge/c"
  )
}

// Copy plugin-generated BridgeRegistry.kt to a per-module sub-package to avoid
// __bridge_fqns conflicts when multiple annotated modules are compiled together.
// defineJs.kt scans all sub-packages of 'generated' for __bridge_fqns at runtime.
tasks.register('copyBridgeRegistryKt', Copy) {
  dependsOn('compileKotlinJvm')
  from("${buildDir}/generated/bridge/c") {
    include('BridgeRegistry.kt')
    filter { line ->
      line.replace('package app.cash.zipline.bridge.generated',
                   'package app.cash.zipline.bridge.generated.proto')
    }
  }
  into("${buildDir}/generated/bridge/kt-src/app/cash/zipline/bridge/generated/proto")
}
kotlin.sourceSets.jsMain {
  kotlin.srcDir("${buildDir}/generated/bridge/kt-src")
}
tasks.named('compileKotlinJs').configure { dependsOn('copyBridgeRegistryKt') }
tasks.named('jsSourcesJar').configure { dependsOn('copyBridgeRegistryKt') }
